<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>紫语星枢</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
    .splash {
      position: relative;
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 26px;
      background:
        radial-gradient(260px 200px at 50% 26%, rgba(192, 132, 252, 0.35), transparent 70%),
        linear-gradient(155deg, #1b0936, #2b0e53 55%, #3b126e);
      border: 1px solid rgba(216, 180, 254, 0.22);
      box-shadow: 0 30px 80px -24px rgba(8, 2, 20, 0.9);
      color: #fff;
      overflow: hidden;
    }
    .splash::after {
      content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.16) .6px, transparent .6px);
      background-size: 6px 6px; opacity: .14;
      mask-image: linear-gradient(to bottom, #000, transparent 72%);
    }
    .orb {
      position: relative; z-index: 2;
      width: 84px; height: 84px; border-radius: 26px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.18);
      display: grid; place-items: center;
      box-shadow: 0 0 60px rgba(168,85,247,.5), inset 0 1px 0 rgba(255,255,255,.2);
      animation: float 3s ease-in-out infinite;
    }
    .orb img { width: 74px; height: 74px; border-radius: 22px; }
    h1 { position: relative; z-index: 2; margin: 16px 0 4px; font-size: 19px; letter-spacing: .24em; font-weight: 600; }
    p { position: relative; z-index: 2; margin: 0; font-size: 9px; letter-spacing: .16em; color: rgba(233,220,255,.5); }
    .bar { position: relative; z-index: 2; width: 126px; height: 3px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 18px; }
    .bar span { display: block; width: 45%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #a78bfa, #f0abfc); animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(330%); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="orb"><img src="../assets/icon-512.png" alt="" /></div>
    <h1>紫语星枢</h1>
    <p>LILACLINGUA AI · STARTING</p>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
