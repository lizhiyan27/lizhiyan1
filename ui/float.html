<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>紫语星枢 · 双语浮窗</title>
  <link rel="stylesheet" href="./float.css" />
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 48 48">
      <path fill="currentColor" d="M24 3.5l4.9 10.2 11.2 1.6-8.1 7.9 1.9 11.2L24 29.1 14.1 34.4l1.9-11.2-8.1-7.9 11.2-1.6L24 3.5z" opacity=".95"/>
      <path fill="#fff" d="M24 13.2l2.4 5 5.5.8-4 3.9.9 5.5-4.8-2.6-4.8 2.6.9-5.5-4-3.9 5.5-.8 2.4-5z" opacity=".88"/>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 4H6l4-4-1-6zM12 14v6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 10v4h3l4 3V7l-4 3H4zM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></symbol>
  </svg>

  <div class="float-shell" id="shell">
    <header class="float-head">
      <div class="brand-mini">
        <span class="brand-orb"><svg><use href="#i-logo"/></svg></span>
        <div class="brand-copy">
          <strong id="brandTitle">紫语星枢</strong>
          <span id="brandSub">BILINGUAL OVERLAY</span>
        </div>
      </div>
      <div class="head-center">
        <span class="feature-tag" id="featureTag">文本翻译</span>
        <span class="live-tag" id="liveTag"><i></i>LIVE</span>
        <button class="feature-tag" id="ocrCaptureBtn" style="display:none;cursor:pointer;background:rgba(168,85,247,0.35);border-color:rgba(216,180,254,0.45);color:#fff;-webkit-app-region:no-drag;" title="立即截取屏幕并识别翻译">⚡ 立即识屏</button>
      </div>
      <div class="head-actions">
        <button class="head-btn" id="pinBtn" title="置顶"><svg><use href="#i-pin"/></svg></button>
        <button class="head-btn" id="copyBtn" title="复制译文"><svg><use href="#i-copy"/></svg></button>
        <button class="head-btn close" id="closeBtn" title="关闭浮窗"><svg><use href="#i-close"/></svg></button>
      </div>
    </header>

    <main class="float-body" id="body">
      <section class="line original-line">
        <div class="line-head">
          <span class="line-label">原文</span>
          <span class="line-lang" id="sourceLang">中文</span>
          <button class="line-btn" id="speakOriginal" title="朗读原文"><svg><use href="#i-volume"/></svg></button>
        </div>
        <p class="line-text" id="originalText">浮窗已就绪，识别或翻译后的原文会显示在这里。</p>
      </section>
      <div class="divider"><span></span><svg><use href="#i-spark"/></svg><span></span></div>
      <section class="line translated-line">
        <div class="line-head">
          <span class="line-label accent">译文</span>
          <span class="line-lang" id="targetLang">English</span>
          <button class="line-btn" id="speakTranslation" title="朗读译文"><svg><use href="#i-volume"/></svg></button>
        </div>
        <p class="line-text translated" id="translatedText">Drag the top bar to move, drag the corner to resize.</p>
      </section>
    </main>

    <footer class="float-foot">
      <span class="resize-hint" id="sizeHint">拖动右下角缩放</span>
      <div class="scale-controls">
        <button class="mini-btn" id="fontDown" title="缩小字号">A−</button>
        <button class="mini-btn" id="fontUp" title="放大字号">A+</button>
      </div>
      <span class="live-dot" id="statusDot"></span>
    </footer>
    <div class="resize-grip" id="resizeGrip" title="拖动调整大小"></div>
  </div>
  <script src="./float.js"></script>
</body>
</html>
